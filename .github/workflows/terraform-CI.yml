---
name: 'Terraform CI'

on:  # yamllint disable-line rule:truthy
  pull_request:

permissions:
  id-token: write  # This is required for requesting the JWT
  contents: read

concurrency:
  group: aws-control
  cancel-in-progress: false

jobs:
  terraform:
    name: 'Terraform Test'
    runs-on: ["self-hosted", "Linux", "noble"]
    timeout-minutes: 120
    env:
      GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
      ROLE_ARN: "arn:aws:iam::303467602807:role/openvpn-tester"
      OPENVPN_CLIENT_SECRET: ${{ secrets.OPENVPN_CLIENT_SECRET }}
      GOOGLE_PROJECT: "openvpn-427715"

    # Use the Bash shell regardless whether the GitHub Actions runner
    # is ubuntu-latest, macos-latest, or windows-latest
    defaults:
      run:
        shell: bash

    steps:
      # Checkout the repository to the GitHub Actions runner
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          role-session-name: "terraform-ci"
          aws-region: "us-west-1"
          role-duration-seconds: 7200

      # Keyless GCP auth via GitHub OIDC federation -- mirrors the AWS auth above.
      # One-time GCP setup: scripts/setup-ci-gcp-auth.sh. Writes a credential file
      # and sets GOOGLE_APPLICATION_CREDENTIALS, which both Terraform's google
      # provider and the test's google-auth pick up as ADC.
      - name: Configure GCP Credentials
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: "projects/145076599640/locations/global/workloadIdentityPools/github/providers/github-oidc"
          service_account: "openvpn-tester@openvpn-427715.iam.gserviceaccount.com"

      # Install the latest version of Terraform CLI
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      # Prepare Python environment
      - name: Setup Python Environment
        run: make bootstrap

      # Run all required linters
      - name: Code Style Check
        run: make lint

      # Run Checkov security scan
      - name: Checkov Security Scan
        run: |
          checkov -d . --config-file .checkov.yml

      # Generates an execution plan for Terraform
      - name: Terraform Tests
        run: make test
