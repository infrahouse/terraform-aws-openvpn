---
# Install with `pre-commit install` (see CONTRIBUTING.md). The repo hook from
# `make install-hooks` is kept as pre-commit.legacy and still runs afterwards.
# Run checks manually with: pre-commit run --all-files
repos:
  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.108.1
    hooks:
      - id: terraform_fmt
      - id: terraform_docs
      - id: terraform_tflint
        args:
          # Style warnings (untyped vars, unused declarations) are visible but
          # only genuine errors block the commit.
          - --args=--minimum-failure-severity=error
